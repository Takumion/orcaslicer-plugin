# A published GitHub release becomes a new version of Takumion Link on Orca Cloud.
# The release's tag (vX.Y.Z) must match pyproject.toml's version and be higher than
# the version on Orca Cloud; its notes become the changelog there.
#
# The job tests, builds the wheel and the single-file .py, attaches both to the
# release, then uploads the wheel to Orca Cloud. No secrets: Orca Cloud trusts the
# GitHub-signed OIDC token of this repository, connected to the listing in
# Orca Cloud › Edit plugin › GitHub publishing
# (https://cloud.orcaslicer.com/wiki/#publish-from-github).
name: Publish to OrcaCloud

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write

env:
  # Only the wheel: Orca Cloud's review rates the single-file bundle higher (it exec()s
  # its embedded modules); the .py stays a GitHub release asset.
  PLUGIN_FILES: "dist/*.whl"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag names the version being released
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Test
        run: |
          python -m pip install --quiet "pytest>=8"
          python -m pytest -q

      - name: Build the wheel and the single-file plugin
        run: |
          python packaging/build_wheel.py
          python packaging/bundle.py

      - name: Attach both to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/takumion_link_any.py --clobber

      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          args=(-F "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
